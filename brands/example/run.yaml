# State for one brand run. Made by the onboard-brand skill, updated after every step.
# The session digest reads this to see where a run stopped, so keep the step names and their
# order as they are. A step counts as pending while it says "todo" or is blank.
brand: example                  # folder name, matches brands/<name>/
brand_id: ""                    # the brand whose creatives you read
created: ""                     # YYYY-MM-DD

secrets:
  doppler_project: ""
  doppler_config: ""

scope:
  media: [video, image]
  date_from: ""                 # blank = the whole account
  date_to: ""
  spend_gate: 0                 # lowest spend a creative needs to be worth analysing; 0 = all
  campaign_filter: ""           # optional, limit to one campaign
  scout_sample: 15              # how many creatives to watch before writing the prompt

output:
  test_brand_id: ""             # LEAVE BLANK unless the operator asked for a test brand.
                                # Blank = entities go back to the same brand.
  register_facets: true         # add the facet list to the brand's Mongo metrics doc
  load_timeline: true

vertical: ""                    # prompts/<vertical>.txt — name it after the kind of product,
                                # not the brand, so the next similar brand can reuse it

steps:
  discover: todo
  inventory: todo
  scout: todo
  prompt: todo
  feedback: todo
  coverage_audit: todo
  extract: todo
  timeline: todo
  verify: todo
  load_ch: todo
  register_facets: todo
  smoke: todo

log: []                         # one line per finished step: "YYYY-MM-DD <step> <what happened>"
